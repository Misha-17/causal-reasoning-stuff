<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc"><title id="title">A world of causes and effects</title><desc id="desc">An illustrative graph. Rain and a sprinkler each have an assumed causal arrow to a wet road. Observation, intervention and counterfactuals ask different questions about this world.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L10 6L1 11" fill="none" stroke="#235347" stroke-width="1.5"/></marker></defs><g fill="none" stroke="#cecfc2"><circle cx="300" cy="300" r="240"/><circle cx="300" cy="300" r="155" stroke-dasharray="2 9"/><path d="M300 32V65M300 535V568M32 300H65M535 300H568"/></g><g font-family="Georgia,serif" fill="#252d29"><text x="111" y="148" font-size="28">Rain</text><text x="78" y="478" font-size="28">Sprinkler</text><text x="377" y="367" font-size="28">Wet road</text></g><g fill="none" stroke="#235347" stroke-width="2.5" marker-end="url(#arrow)"><path d="M154 204C240 205 304 260 401 300"/><path d="M156 407C254 407 324 357 401 313"/></g><circle cx="137" cy="201" r="13" fill="#235347"/><circle cx="137" cy="408" r="13" fill="#235347"/><circle cx="426" cy="306" r="18" fill="#a64b31"/><g stroke="#235347" stroke-width="2" fill="none" stroke-linecap="round"><path d="M98 173l-6 11M113 180l-6 11M82 163l-6 11M99 395Q71 375 56 393M96 389Q85 361 65 361M101 395Q82 389 58 402"/></g><g font-family="Arial,sans-serif" fill="#626b61" font-size="11" letter-spacing="2"><text x="300" y="86" text-anchor="middle">OBSERVE</text><text x="300" y="531" text-anchor="middle">CHANGE · REPLAY</text></g><text x="300" y="573" text-anchor="middle" font-family="Georgia,serif" font-style="italic" fill="#235347" font-size="20">One world. Different questions.</text></svg>
