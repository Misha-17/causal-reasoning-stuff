<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="713" viewBox="0 0 1200 713" role="img" aria-labelledby="title desc"><title id="title">Accuracy improves when exact proposition tables are supplied</title><desc id="desc">Local Qwen3-4B main factorial study: no tables 49/192 correct, 25.52%; execution materialization 64/192, 33.33%; proposition assistance 106/192, 55.21%. Execution tables versus raw: Holm adjusted p=.2714844. Proposition tables versus execution tables: gain 21.875 percentage points, adjusted p=.0067749. Analyses preserve 24 world clusters. These are oracle-assisted task reductions, not improved unaided causal ability.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#235347" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><text x="48" y="55" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="2">LOCAL QWEN3-4B / MAIN FACTORIAL STUDY</text><text x="48" y="105" fill="#252d29" font-family="Georgia, serif" font-size="40" font-weight="400" text-anchor="start">Exact tables helped, but errors remained</text><text x="48" y="151" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Accuracy over 192 responses per assistance level, grouped into 24 underlying worlds.</text><line x1="377.0" y1="205" x2="377.0" y2="524" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 7"/><text x="377.0" y="557" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">0%</text><line x1="538.5" y1="205" x2="538.5" y2="524" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 7"/><text x="538.5" y="557" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">25%</text><line x1="700.0" y1="205" x2="700.0" y2="524" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 7"/><text x="700.0" y="557" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">50%</text><line x1="861.5" y1="205" x2="861.5" y2="524" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 7"/><text x="861.5" y="557" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">75%</text><line x1="1023.0" y1="205" x2="1023.0" y2="524" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 7"/><text x="1023.0" y="557" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">100%</text><text x="48" y="252" fill="#252d29" font-family="Georgia, serif" font-size="24" font-weight="400" text-anchor="start">No tables</text><text x="48" y="282" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Model computes everything</text><line x1="377" y1="247" x2="541.8645833333333" y2="247" stroke="#777e72" stroke-width="3"/><circle cx="541.8645833333333" cy="247" r="9" fill="#777e72" stroke="#777e72" stroke-width="2"/><text x="562.8645833333333" y="255" fill="#777e72" font-family="Georgia, serif" font-size="28" font-weight="400" text-anchor="start">25.52%</text><text x="686.8645833333333" y="253" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">49/192</text><text x="48" y="367" fill="#252d29" font-family="Georgia, serif" font-size="24" font-weight="400" text-anchor="start">Execution tables</text><text x="48" y="397" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">All intermediate values supplied</text><line x1="377" y1="362" x2="592.3333333333333" y2="362" stroke="#b95739" stroke-width="3"/><circle cx="592.3333333333333" cy="362" r="9" fill="#b95739" stroke="#b95739" stroke-width="2"/><text x="613.3333333333333" y="370" fill="#b95739" font-family="Georgia, serif" font-size="28" font-weight="400" text-anchor="start">33.33%</text><text x="737.3333333333333" y="368" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">64/192</text><text x="377" y="402" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">vs. no tables: adjusted p = .2714844</text><text x="48" y="482" fill="#252d29" font-family="Georgia, serif" font-size="24" font-weight="400" text-anchor="start">Proposition tables</text><text x="48" y="512" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Eligible worlds + target truth bits</text><line x1="377" y1="477" x2="733.6458333333334" y2="477" stroke="#235347" stroke-width="3"/><circle cx="733.6458333333334" cy="477" r="9" fill="#235347" stroke="#235347" stroke-width="2"/><text x="754.6458333333334" y="485" fill="#235347" font-family="Georgia, serif" font-size="28" font-weight="400" text-anchor="start">55.21%</text><text x="878.6458333333334" y="483" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">106/192</text><text x="377" y="517" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">vs. execution tables: adjusted p = .0067749</text><line x1="48" y1="598" x2="1152" y2="598" stroke="#cbcfc1" stroke-width="1.4"/><text x="48" y="637" fill="#252d29" font-family="Georgia, serif" font-size="20" font-weight="400" text-anchor="start">Oracle assistance removes parts of the task. It does not measure improved unaided capability.</text><text x="48" y="675" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">The significant proposition-table increment is +21.875 percentage points over execution tables.</text></svg>