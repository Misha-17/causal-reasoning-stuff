<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="707" viewBox="0 0 1200 707" role="img" aria-labelledby="title desc"><title id="title">Reasoning scaffolds repair some answers and harm others</title><desc id="desc">Kimi K3 CausalCoT versus direct answers on 10,112 matched questions repairs 123 and harms 152, net minus 29. An unidentified OpenRouter archive repairs 59 and harms 41, net plus 18 on 10,112 items. A selected Opus rerun repairs 114 and harms 39, net plus 75 on 4,607 originally empty-reasoning items. The Opus sample and undocumented intervention differ; rows are not a model ranking.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#235347" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><text x="48" y="55" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="2">PAIRED ANSWER CHANGES</text><text x="48" y="105" fill="#252d29" font-family="Georgia, serif" font-size="40" font-weight="400" text-anchor="start">Extra instructions can repair — and harm</text><text x="48" y="151" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Each bar counts questions that changed correctness on the same matched items.</text><circle cx="405" cy="193" r="5" fill="#b95739" stroke="#b95739" stroke-width="2"/><text x="420" y="199" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Correct → wrong</text><circle cx="683" cy="193" r="5" fill="#235347" stroke="#235347" stroke-width="2"/><text x="698" y="199" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Wrong → correct</text><line x1="400.0" y1="234" x2="400.0" y2="556" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 6"/><text x="400.0" y="585" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">160</text><line x1="540.0" y1="234" x2="540.0" y2="556" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 6"/><text x="540.0" y="585" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">80</text><line x1="680.0" y1="234" x2="680.0" y2="556" stroke="#cbcfc1" stroke-width="1"/><text x="680.0" y="585" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">0</text><line x1="820.0" y1="234" x2="820.0" y2="556" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 6"/><text x="820.0" y="585" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">80</text><line x1="960.0" y1="234" x2="960.0" y2="556" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 6"/><text x="960.0" y="585" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">160</text><text x="1112" y="226" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="end" letter-spacing="2">NET</text><text x="48" y="280" fill="#252d29" font-family="Georgia, serif" font-size="24" font-weight="400" text-anchor="start">Kimi K3</text><text x="48" y="310" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">CausalCoT · 10,112 items</text><line x1="414.0" y1="280" x2="680" y2="280" stroke="#b95739" stroke-width="14"/><line x1="680" y1="280" x2="895.25" y2="280" stroke="#235347" stroke-width="14"/><text x="398.0" y="287" fill="#b95739" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="end">152</text><text x="911.25" y="287" fill="#235347" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">123</text><text x="1112" y="290" fill="#b95739" font-family="Georgia, serif" font-size="36" font-weight="400" text-anchor="end">−29</text><text x="48" y="390" fill="#252d29" font-family="Georgia, serif" font-size="24" font-weight="400" text-anchor="start">OpenRouter archive</text><text x="48" y="420" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">CausalCoT · 10,112 items</text><line x1="608.25" y1="390" x2="680" y2="390" stroke="#b95739" stroke-width="14"/><line x1="680" y1="390" x2="783.25" y2="390" stroke="#235347" stroke-width="14"/><text x="592.25" y="397" fill="#b95739" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="end">41</text><text x="799.25" y="397" fill="#235347" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">59</text><text x="1112" y="400" fill="#235347" font-family="Georgia, serif" font-size="36" font-weight="400" text-anchor="end">+18</text><text x="48" y="525" fill="#252d29" font-family="Georgia, serif" font-size="24" font-weight="400" text-anchor="start">Selected Opus rerun</text><text x="48" y="555" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">4,607 items · different subset</text><line x1="611.75" y1="525" x2="680" y2="525" stroke="#b95739" stroke-width="14"/><line x1="680" y1="525" x2="879.5" y2="525" stroke="#235347" stroke-width="14"/><text x="595.75" y="532" fill="#b95739" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="end">39</text><text x="895.5" y="532" fill="#235347" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">114</text><text x="1112" y="535" fill="#235347" font-family="Georgia, serif" font-size="36" font-weight="400" text-anchor="end">+75</text><line x1="48" y1="448" x2="1152" y2="448" stroke="#cbcfc1" stroke-width="1"/><text x="48" y="634" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Opus: only items with originally empty reasoning were rerun. The changed request is unidentified.</text><text x="48" y="669" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Counts describe these archives; the three rows do not establish a comparable model ranking.</text></svg>