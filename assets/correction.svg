<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="731" viewBox="0 0 1200 731" role="img" aria-labelledby="title desc"><title id="title">A benchmark mechanism mismatch reverses item 9570</title><desc id="desc">At factual U=0 and intervention do(X=0), displayed equations X=NOT(U), Z=U, Y=X OR Z give Y=0, No. Generator equations X=U, Z=NOT(U), Y=X OR Z give Y=1, Yes. The untouched Z equation retains dependence on U. This localized mismatch caused 37 deterministic label flips.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#235347" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><text x="48" y="55" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="2">BENCHMARK AUDIT / ITEM 9570</text><text x="48" y="105" fill="#252d29" font-family="Georgia, serif" font-size="40" font-weight="400" text-anchor="start">The same question, opposite answers</text><text x="48" y="151" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Known fact: U = 0. Requested change: force X = 0. Keep the other rules intact.</text><text x="48" y="221" fill="#252d29" font-family="Georgia, serif" font-size="25" font-weight="400" text-anchor="start">Rules shown in the question</text><line x1="48" y1="246" x2="552" y2="246" stroke="#cbcfc1" stroke-width="1.4"/><text x="48" y="289" fill="#252d29" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start">X = NOT(U)</text><text x="48" y="330" fill="#252d29" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start">Z = U</text><text x="48" y="371" fill="#252d29" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start">Y = X OR Z</text><path d="M278 400 L278 444" fill="none" stroke="#235347" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="48" y="486" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1.4">After the intervention</text><text x="48" y="526" fill="#252d29" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">X = 0; Z = 0</text><text x="48" y="568" fill="#235347" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" text-anchor="start">Y = 0 OR 0 = 0</text><text x="508" y="572" fill="#235347" font-family="Georgia, serif" font-size="36" font-weight="400" text-anchor="end">NO</text><text x="645" y="221" fill="#252d29" font-family="Georgia, serif" font-size="25" font-weight="400" text-anchor="start">Rules used by the generator</text><line x1="645" y1="246" x2="1149" y2="246" stroke="#cbcfc1" stroke-width="1.4"/><text x="645" y="289" fill="#252d29" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start">X = U</text><text x="645" y="330" fill="#252d29" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start">Z = NOT(U)</text><text x="645" y="371" fill="#252d29" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start">Y = X OR Z</text><path d="M875 400 L875 444" fill="none" stroke="#235347" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="645" y="486" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1.4">After the intervention</text><text x="645" y="526" fill="#252d29" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">X = 0; Z = 1</text><text x="645" y="568" fill="#b95739" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" text-anchor="start">Y = 0 OR 1 = 1</text><text x="1105" y="572" fill="#b95739" font-family="Georgia, serif" font-size="36" font-weight="400" text-anchor="end">YES</text><line x1="48" y1="615" x2="1152" y2="615" stroke="#cbcfc1" stroke-width="1.4"/><text x="48" y="655" fill="#252d29" font-family="Georgia, serif" font-size="25" font-weight="400" text-anchor="start">The released label is YES. The displayed rules support NO.</text><text x="48" y="695" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">The audit found 37 deterministic label flips caused by this branch mismatch.</text></svg>