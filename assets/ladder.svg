<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="677" viewBox="0 0 1200 677" role="img" aria-labelledby="title desc"><title id="title">Three kinds of causal reasoning</title><desc id="desc">Illustrative graph with Rain and Sprinkler both causing Wet road. Observation asks what is seen together; intervention changes a mechanism; counterfactual reasoning replays a different action in the same situation. This is an illustration, not experimental evidence.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#235347" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><text x="48" y="55" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="2">ONE WORLD. THREE DIFFERENT QUESTIONS.</text><text x="48" y="105" fill="#252d29" font-family="Georgia, serif" font-size="40" font-weight="400" text-anchor="start">Seeing, changing, imagining</text><text x="48" y="151" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Illustration: this schematic explains the task types; it is not an experimental result.</text><circle cx="205" cy="267" r="11" fill="#235347" stroke="#235347" stroke-width="2"/><circle cx="205" cy="453" r="11" fill="#235347" stroke="#235347" stroke-width="2"/><circle cx="441" cy="360" r="11" fill="#235347" stroke="#235347" stroke-width="2"/><path d="M219 270 C288 278 328 341 422 354" fill="none" stroke="#235347" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M219 451 C287 442 326 379 422 367" fill="none" stroke="#235347" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="174" y="230" fill="#252d29" font-family="Georgia, serif" font-size="26" font-weight="400" text-anchor="middle">Rain</text><text x="182" y="502" fill="#252d29" font-family="Georgia, serif" font-size="26" font-weight="400" text-anchor="middle">Sprinkler</text><text x="442" y="411" fill="#252d29" font-family="Georgia, serif" font-size="26" font-weight="400" text-anchor="middle">Wet road</text><path d="M130 252 l-5 10" fill="none" stroke="#235347" stroke-width="2" stroke-linecap="round"/><path d="M151 272 l-5 10" fill="none" stroke="#235347" stroke-width="2" stroke-linecap="round"/><path d="M168 250 l-5 10" fill="none" stroke="#235347" stroke-width="2" stroke-linecap="round"/><path d="M116 446 Q116 421 136 413 M116 446 Q132 422 157 425 M116 446 Q139 442 158 452" fill="none" stroke="#235347" stroke-width="2" stroke-linecap="round"/><line x1="570" y1="211" x2="570" y2="582" stroke="#cbcfc1" stroke-width="1"/><text x="610" y="240" fill="#b95739" font-family="Georgia, serif" font-size="20" font-weight="400" text-anchor="start">01</text><text x="662" y="240" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">OBSERVE</text><text x="662" y="277" fill="#252d29" font-family="Georgia, serif" font-size="22" font-weight="400" text-anchor="start">Is the road wet when the sprinkler is on?</text><text x="662" y="313" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Compare what is seen together.</text><text x="610" y="372" fill="#b95739" font-family="Georgia, serif" font-size="20" font-weight="400" text-anchor="start">02</text><text x="662" y="372" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">INTERVENE</text><text x="662" y="409" fill="#252d29" font-family="Georgia, serif" font-size="22" font-weight="400" text-anchor="start">Would turning the sprinkler on wet the road?</text><text x="662" y="445" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Change one mechanism and follow its effects.</text><text x="610" y="505" fill="#b95739" font-family="Georgia, serif" font-size="20" font-weight="400" text-anchor="start">03</text><text x="662" y="505" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">COUNTERFACTUAL</text><text x="662" y="542" fill="#252d29" font-family="Georgia, serif" font-size="22" font-weight="400" text-anchor="start">Would this road still be wet had it stayed off?</text><text x="662" y="578" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Keep the same situation; replay a different action.</text><text x="48" y="636" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Arrows describe the assumed causal rules. The answer also depends on the information supplied.</text></svg>