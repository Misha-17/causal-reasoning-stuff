<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="694" viewBox="0 0 1200 694" role="img" aria-labelledby="title desc"><title id="title">Historical verifier acceptance of shuffled reasoning</title><desc id="desc">A negative control transplanted reasoning from a different query type into each of the first 300 stored target rows, retaining target question and metadata. Historical acceptance is 216/300, 72%; raw directed acceptance is 125/300, 41.67%. These are formalizer-output scoring-policy comparisons, not hidden-rationale faithfulness measures. The selected targets are not a documented random sample.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#235347" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><text x="48" y="55" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="2">FORMALIZER NEGATIVE CONTROL / 300 SHUFFLED TARGETS</text><text x="48" y="105" fill="#252d29" font-family="Georgia, serif" font-size="40" font-weight="400" text-anchor="start">A checker can accept the wrong explanation</text><text x="48" y="151" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Reasoning was transplanted from a different query type while the target question stayed fixed.</text><line x1="377.0" y1="207" x2="377.0" y2="457" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 7"/><text x="377.0" y="493" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">0%</text><line x1="535.75" y1="207" x2="535.75" y2="457" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 7"/><text x="535.75" y="493" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">25%</text><line x1="694.5" y1="207" x2="694.5" y2="457" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 7"/><text x="694.5" y="493" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">50%</text><line x1="853.25" y1="207" x2="853.25" y2="457" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 7"/><text x="853.25" y="493" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">75%</text><line x1="1012.0" y1="207" x2="1012.0" y2="457" stroke="#cbcfc1" stroke-width="1" stroke-dasharray="3 7"/><text x="1012.0" y="493" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">100%</text><text x="48" y="263" fill="#252d29" font-family="Georgia, serif" font-size="24" font-weight="400" text-anchor="start">Historical acceptance</text><line x1="377" y1="258" x2="834.2" y2="258" stroke="#b95739" stroke-width="3"/><circle cx="834.2" cy="258" r="9" fill="#b95739" stroke="#b95739" stroke-width="2"/><text x="852.2" y="266" fill="#b95739" font-family="Georgia, serif" font-size="29" font-weight="400" text-anchor="start">72.00%</text><text x="377" y="300" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">216/300 accepted transplanted traces</text><text x="48" y="386" fill="#252d29" font-family="Georgia, serif" font-size="24" font-weight="400" text-anchor="start">Strict directed check</text><line x1="377" y1="381" x2="641.5833333333333" y2="381" stroke="#235347" stroke-width="3"/><circle cx="641.5833333333333" cy="381" r="9" fill="#235347" stroke="#235347" stroke-width="2"/><text x="659.5833333333333" y="389" fill="#235347" font-family="Georgia, serif" font-size="29" font-weight="400" text-anchor="start">41.67%</text><text x="377" y="423" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">125/300 accepted transplanted traces</text><line x1="48" y1="541" x2="1152" y2="541" stroke="#cbcfc1" stroke-width="1.4"/><text x="48" y="581" fill="#252d29" font-family="Georgia, serif" font-size="20" font-weight="400" text-anchor="start">Acceptance depends on the scoring rule. The stricter audit accepted fewer transplanted traces.</text><text x="48" y="621" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">These are formalizer-output checks, not direct evidence of hidden reasoning faithfulness.</text><text x="48" y="656" fill="#777e72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Targets are the first 300 stored rows, not a documented random sample.</text></svg>